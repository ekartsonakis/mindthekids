<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF3FF"/>
      <stop offset="50%" stop-color="#FAF4EB"/>
      <stop offset="100%" stop-color="#E9F9F1"/>
    </linearGradient>
    <linearGradient id="orbBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89A3FF"/>
      <stop offset="100%" stop-color="#5B78E5"/>
    </linearGradient>
    <linearGradient id="orbGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CE0B3"/>
      <stop offset="100%" stop-color="#43B782"/>
    </linearGradient>
    <linearGradient id="orbAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD479"/>
      <stop offset="100%" stop-color="#F2A638"/>
    </linearGradient>
    <linearGradient id="orbCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9B95"/>
      <stop offset="100%" stop-color="#E86A63"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2F2A38" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Soft squircle background -->
  <rect width="240" height="240" x="8" y="8" rx="64" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="6"/>

  <!-- 4 Soft 3D Pastel Petals -->
  <g filter="url(#softShadow)">
    <circle cx="92" cy="94" r="44" fill="url(#orbAmber)"/>
    <circle cx="164" cy="94" r="44" fill="url(#orbGreen)"/>
    <circle cx="92" cy="162" r="44" fill="url(#orbBlue)"/>
    <circle cx="164" cy="162" r="44" fill="url(#orbCoral)"/>
  </g>

  <!-- Center friendly cloud-face badge -->
  <g filter="url(#softShadow)">
    <circle cx="128" cy="128" r="56" fill="#FFFFFF"/>
    <circle cx="128" cy="128" r="53" fill="none" stroke="#F3EFEA" stroke-width="3"/>
  </g>

  <!-- Specular highlights on petals -->
  <ellipse cx="78" cy="76" rx="12" ry="6" transform="rotate(-30 78 76)" fill="#FFFFFF" opacity="0.45"/>
  <ellipse cx="150" cy="76" rx="12" ry="6" transform="rotate(-30 150 76)" fill="#FFFFFF" opacity="0.45"/>

  <!-- Cute calm smiling face -->
  <circle cx="109" cy="121" r="6.5" fill="#2F2A38"/>
  <circle cx="147" cy="121" r="6.5" fill="#2F2A38"/>
  <circle cx="107" cy="119" r="2.2" fill="#FFFFFF"/>
  <circle cx="145" cy="119" r="2.2" fill="#FFFFFF"/>

  <!-- Rosy cheeks -->
  <ellipse cx="96" cy="133" rx="7.5" ry="5" fill="#FF9AA2" opacity="0.65"/>
  <ellipse cx="160" cy="133" rx="7.5" ry="5" fill="#FF9AA2" opacity="0.65"/>

  <!-- Gentle smile -->
  <path d="M 114 136 Q 128 149 142 136" fill="none" stroke="#2F2A38" stroke-width="6" stroke-linecap="round"/>
</svg>
